name: Azure Static Web Apps CI/CD 🌐

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # Installe toutes les dépendances du monorepo (shared, frontend, backend).
      # AVANT le build de shared : sinon il utilisait le tsc de l'image du
      # runner et non le TypeScript épinglé du projet.
      - name: Install workspace dependencies
        run: npm ci

      # Doit être buildé avant le frontend, qui en dépend via @mercury/shared
      - name: Build @mercury/shared
        run: npm run build:shared

      - name: Build frontend
        run: npm run build --workspace=frontend

      # Le mode live d'impeccable injecte un script localhost:8400 dans
      # src/index.html le temps d'une session de design : il ne doit jamais
      # partir en production (déjà arrivé, commit 025f0e87).
      - name: Refuse the impeccable live script in the build
        run: |
          if grep -qE "impeccable-live-start|localhost:8400/live\.js" frontend/www/index.html; then
            echo "::error file=frontend/src/index.html::the impeccable live script is still injected"
            exit 1
          fi

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_FIELD_0090CDD03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/www"
          output_location: ""
          skip_app_build: true