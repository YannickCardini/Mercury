name: Build Android App Bundle 🤖

# --- Lance le build Android manuellement ---
on:
  workflow_dispatch:
# -------------------------------------------

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: npm ci

      - name: Build @mercury/shared
        run: npm run build:shared

      - name: Build Web App (Production)
        run: npm run build --workspace=frontend

      # Même garde-fou que frontend.yml : le script du mode live d'impeccable
      # (localhost:8400) ne doit jamais finir dans un bundle publié.
      - name: Refuse the impeccable live script in the build
        run: |
          if grep -qE "impeccable-live-start|localhost:8400/live\.js" frontend/www/index.html; then
            echo "::error file=frontend/src/index.html::the impeccable live script is still injected"
            exit 1
          fi

      - name: Build Android App Bundle
        run: |
          cd frontend
          npx cap sync android
          cd android
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab