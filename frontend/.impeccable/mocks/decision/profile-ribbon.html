<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Profile, stat ribbon</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"><style>html,body{width:390px;height:844px}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f0f8ff;background:linear-gradient(#05080f,#0b101e 45%,#131a2e);overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(6,8,16,.68)}
.card{position:relative;background:#133246;border:1px solid #25536b;border-radius:28px;box-shadow:0 4px 0 #081a26,0 22px 40px -22px rgba(0,0,0,.7)}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(240,248,255,.05);border:1px solid rgba(240,248,255,.18);display:grid;place-items:center;color:rgba(240,248,255,.74);font-size:14px}
.av{border-radius:50%;background:linear-gradient(135deg,#c9a27c,#7a5a44);flex:none}
.h{font-family:'Baloo 2',system-ui;font-weight:700;line-height:1.1}
.lbl{font-size:13px;font-weight:700;color:rgba(240,248,255,.52)}
.sub{font-size:13px;color:rgba(240,248,255,.74);font-weight:600}
.cup{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#081a26;box-shadow:inset 0 3px 5px rgba(0,0,0,.5),0 1px 0 rgba(240,248,255,.14)}
.tok{position:relative;border-radius:50%;background:var(--f);box-shadow:0 2px 0 var(--d);display:block}
.tok svg{width:100%;height:100%}
.ink{fill:currentColor}.soft{fill:currentColor;opacity:.42}.rim{fill:none;stroke:var(--f);stroke-width:1.4;stroke-linecap:round}.shine{fill:var(--f);opacity:.55}.burst{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}.cell{fill:none;stroke:currentColor;stroke-width:1.3;opacity:.5}
.well{background:#0e2736;border:1px solid rgba(240,248,255,.1);border-radius:20px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid rgba(240,248,255,.08)}
.row:first-child{border-top:0}
.pill{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#c8452f;color:#f0f8ff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.chev{margin-left:auto;color:rgba(240,248,255,.52);font-weight:800}
.prev{font-size:12.5px;color:rgba(240,248,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:14px;font-weight:800}
.time{font-size:11.5px;color:rgba(240,248,255,.52);margin-left:auto}
.qbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:rgba(240,248,255,.05);border:1px solid rgba(240,248,255,.18);font-size:13px;font-weight:700;color:rgba(240,248,255,.78)}
.card{position:absolute;left:12px;right:12px;top:40px;bottom:30px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.idt{display:flex;align-items:center;gap:14px;padding-right:34px}
.ribbon{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid rgba(240,248,255,.12);border-radius:16px;overflow:hidden}
.cell{padding:10px 8px;text-align:center;border-left:1px solid rgba(240,248,255,.1)}.cell:first-child{border-left:0}
.cell b{display:block;font-family:'Baloo 2';font-size:26px;line-height:1.05}
.whead{display:flex;align-items:baseline;gap:8px;padding:12px 14px 4px}
.shelf{display:flex;gap:10px;padding:8px 14px 14px}
.out{align-self:center;margin-top:auto;font-size:13px;font-weight:700;color:#f08a76;padding:6px 12px;border-radius:999px;border:1px solid rgba(200,69,47,.3);background:rgba(200,69,47,.1)}</style></head><body><div class="scrim"></div><div class="card"><span class="x">✕</span>
<div class="idt"><span class="av" style="width:64px;height:64px"></span><span style="flex:1"><span class="h" style="font-size:24px;display:block">Camille</span><span class="qbtn" style="padding:4px 10px;font-size:12px;margin-top:4px">✎ Edit profile</span></span></div>
<div class="ribbon"><span class="cell"><b>#12</b><span class="lbl">rank</span></span><span class="cell"><b>1,240</b><span class="lbl">points</span></span><span class="cell"><b style="color:#ffc83d">128</b><span class="lbl">coins</span></span></div>
<div class="well"><div class="whead"><span class="h" style="font-size:18px">Boosters</span><span class="lbl">3 of 3 slots</span><span class="chev" style="font-size:13px">Manage ›</span></div><div class="shelf"><span class="cup" style="width:50px;height:50px"><span class="tok" style="width:33px;height:33px;--f:#ffb703;--d:#c78a00;color:#0c2230"><svg viewBox="0 0 32 32"><circle class="soft" cx="12.6" cy="12.4" r="6.6"/><circle class="ink" cx="18.4" cy="18.6" r="7.6"/><circle class="rim" cx="18.4" cy="18.6" r="5"/><path class="rim" d="M18.4 15.6v6"/></svg></span></span><span class="cup" style="width:50px;height:50px"><span class="tok" style="width:33px;height:33px;--f:#c8452f;--d:#9c3220;color:#f0f8ff"><svg viewBox="0 0 32 32"><circle class="ink" cx="14" cy="18.4" r="7"/><circle class="shine" cx="11.4" cy="15.8" r="1.7"/><path class="burst" d="M21 11.2l3.4-3.4M22.6 14.6l4-.6M18.4 9.4l.6-4"/></svg></span></span><span class="cup" style="width:50px;height:50px"><span class="tok" style="width:33px;height:33px;--f:#00c885;--d:#008f5f;color:#0c2230"><svg viewBox="0 0 32 32"><rect class="cell" x="4.2" y="13" width="5.2" height="6" rx="1.6"/><rect class="cell" x="10.6" y="13" width="5.2" height="6" rx="1.6"/><rect class="cell" x="17" y="13" width="5.2" height="6" rx="1.6"/><rect class="cell" x="23.4" y="13" width="5.2" height="6" rx="1.6"/><circle class="ink" cx="19.6" cy="16" r="3.2"/><circle class="ink" cx="26" cy="16" r="3.2"/></svg></span></span></div></div>
<div class="well"><div class="whead"><span class="h" style="font-size:18px">Messages</span><span class="pill">2</span></div><div class="row"><span class="av" style="width:34px;height:34px;background:linear-gradient(135deg,#8fb3d9,#3c5f86)"></span><span style="min-width:0;flex:1"><span style="display:flex;gap:8px"><span class="nm">Nora</span><span class="time">2 min</span></span><span class="prev" style="display:block">gg, rematch tonight?</span></span><span class=pill>2</span></div><div class="row"><span class="av" style="width:34px;height:34px;background:linear-gradient(135deg,#d9a98f,#86513c)"></span><span style="min-width:0;flex:1"><span style="display:flex;gap:8px"><span class="nm">Théo</span><span class="time">1 h</span></span><span class="prev" style="display:block">You: see you at 9</span></span></div></div>
<span class="out">Sign out</span>
</div></body></html>
