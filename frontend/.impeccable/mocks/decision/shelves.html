<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Boosters, shelves by effect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:linear-gradient(#05080f 0,#080c17 22%,#0b101e 44%,#0f1426 70%,#131a2e 100%);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f0f8ff;padding:40px 12px 22px}
.slab{height:100%;display:flex;flex-direction:column;background:#133246;border:1px solid #25536b;border-radius:28px;box-shadow:0 4px 0 #081a26,0 22px 40px -22px rgba(0,0,0,.7);overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.back{font:700 14px/1 'Plus Jakarta Sans';color:rgba(240,248,255,.78);padding:7px 12px 7px 9px;border-radius:999px;border:1px solid rgba(240,248,255,.1);background:rgba(240,248,255,.05)}
h1{flex:1;font:700 28px/1.1 'Baloo 2'}
.bal{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 7px;border-radius:999px;background:#1b4157;border:1px solid #25536b;box-shadow:0 3px 0 #081a26;font:700 17px/1 'Baloo 2'}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd766,#ffb703 60%,#c78a00);box-shadow:inset 0 0 0 1.5px #c78a00;flex:none}
.strip{display:flex;align-items:center;gap:10px;margin:0 14px;padding:10px 12px;border-radius:999px;background:#0e2736;border:1px solid rgba(240,248,255,.08)}
.strip p{flex:1;font-size:12.5px;font-weight:700;color:rgba(240,248,255,.62);line-height:1.3}
.strip p b{display:block;color:#f0f8ff;font-size:14px}
.cup{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#081a26;box-shadow:inset 0 2px 4px rgba(0,0,0,.55),0 1px 0 rgba(240,248,255,.18)}
.cup .tk{--s:28px}
.cup.empty{font:600 20px/1 'Baloo 2';color:rgba(240,248,255,.4)}
.scroll{flex:1;overflow:hidden;margin-top:12px;border-top:1px solid rgba(240,248,255,.1);padding:4px 14px 0}
.shelf-hd{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 10px}
.shelf-hd h2{font:700 19px/1 'Baloo 2'}
.shelf-hd span{font-size:12px;font-weight:700;color:rgba(240,248,255,.52)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px 10px;border-radius:20px;background:rgba(240,248,255,.05);border:1px solid rgba(240,248,255,.1);text-align:center}
.tile .nm{font-size:12.5px;font-weight:800;line-height:1.2}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:4px}
.st.eq{background:rgba(0,200,133,.12);border:1px solid rgba(0,200,133,.3);color:#6fd0a9}
.st.own{background:rgba(240,248,255,.08);color:rgba(240,248,255,.74)}
.st.pr{font-family:'Baloo 2';font-size:13px;color:#ffc83d;padding:1px 8px}
.st.pr.short{color:rgba(240,248,255,.4)}
.st .coin{width:12px;height:12px}
.tile.locked{background:transparent;border-style:dashed;border-color:rgba(240,248,255,.14)}
.tile.locked .tk{opacity:.5}
.tile.locked .nm{color:rgba(240,248,255,.62)}
.ex{display:block;font-size:10px;font-weight:700;color:rgba(240,248,255,.4)}
.tk{--s:48px;position:relative;width:var(--s);height:var(--s);flex:none}
.tk b{position:absolute;inset:0;border-radius:50%;background:var(--f);box-shadow:0 3px 0 var(--d);display:flex;align-items:center;justify-content:center;padding:0 5px 4px 0;font:700 calc(var(--s)*.46)/1 'Baloo 2';color:var(--o)}
.tk b small{font-size:.78em;margin-right:1px}
.tk i{position:absolute;right:-9%;bottom:-9%;width:46%;height:46%;border-radius:50%;background:#133246;box-shadow:0 0 0 1.5px var(--l);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--l);font-size:calc(var(--s)*.26)}
.tk i .coin{width:62%;height:62%;box-shadow:none}
.tk.live::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--l);opacity:.75}
.pts{--f:#22b8cf;--d:#168499;--o:#0c2230;--l:#6fdcec}
.cns{--f:#ffb703;--d:#c78a00;--o:#0c2230;--l:#ffc83d}
.bty{--f:#c8452f;--d:#9c3220;--o:#f0f8ff;--l:#f08a76}
.grn{--f:#00c885;--d:#008f5f;--o:#0c2230;--l:#6fd0a9}
.blu{--f:#0477bd;--d:#0c5d8c;--o:#f0f8ff;--l:#7fc4f0}
.org{--f:#f7914e;--d:#c96a2b;--o:#0c2230;--l:#f9a56c}
</style>
</head>
<body>
<div class="slab">
  <header class="hd">
    <span class="back">‹ Back</span>
    <h1>Boosters</h1>
    <span class="bal"><span class="coin"></span>128</span>
  </header>

  <div class="strip">
    <span class="cup"><span class="tk cns"><b><small>×</small>2</b><i><span class="coin"></span></i></span></span>
    <span class="cup"><span class="tk bty"><b><small>+</small>1</b><i><span class="coin"></span></i></span></span>
    <span class="cup empty">+</span>
    <p><b>2 of 3 equipped</b>Tap a booster to equip it</p>
  </div>

  <div class="scroll">
    <div class="shelf-hd"><h2>Coins</h2><span>1 of 3 owned</span></div>
    <div class="grid">
      <div class="tile"><span class="tk cns live"><b><small>×</small>2</b><i><span class="coin"></span></i></span><span class="nm">Double Coins</span><span class="st eq">✓ Equipped</span></div>
      <div class="tile locked"><span class="tk grn"><b><small>+</small>1</b><i><span class="coin"></span></i></span><span class="nm">Home Run<span class="ex">example</span></span><span class="st pr"><span class="coin"></span>120</span></div>
      <div class="tile locked"><span class="tk org"><b><small>+</small>5</b><i><span class="coin"></span></i></span><span class="nm">Streak<span class="ex">example</span></span><span class="st pr short"><span class="coin"></span>250</span></div>
    </div>

    <div class="shelf-hd"><h2>Points</h2><span>1 of 2 owned</span></div>
    <div class="grid">
      <div class="tile"><span class="tk pts"><b><small>×</small>2</b><i>✦</i></span><span class="nm">Double Points</span><span class="st own">Owned</span></div>
      <div class="tile locked"><span class="tk blu"><b><small>½</small></b><i>✦</i></span><span class="nm">Comeback<span class="ex">example</span></span><span class="st pr short"><span class="coin"></span>180</span></div>
    </div>

    <div class="shelf-hd"><h2>Captures</h2><span>1 of 2 owned</span></div>
    <div class="grid">
      <div class="tile"><span class="tk bty live"><b><small>+</small>1</b><i><span class="coin"></span></i></span><span class="nm">Bounty</span><span class="st eq">✓ Equipped</span></div>
      <div class="tile locked"><span class="tk org"><b><small>×</small>2</b><i><span class="coin"></span></i></span><span class="nm">Big Game<span class="ex">example</span></span><span class="st pr short"><span class="coin"></span>300</span></div>
    </div>
  </div>
</div>
</body>
</html>
