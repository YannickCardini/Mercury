<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440"><title>Profile, two panes</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"><style>html,body{width:1440px;height:900px}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f0f8ff;background:linear-gradient(#05080f,#0b101e 45%,#131a2e);overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(6,8,16,.68)}
.card{position:relative;background:#133246;border:1px solid #25536b;border-radius:28px;box-shadow:0 4px 0 #081a26,0 22px 40px -22px rgba(0,0,0,.7)}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(240,248,255,.05);border:1px solid rgba(240,248,255,.18);display:grid;place-items:center;color:rgba(240,248,255,.74);font-size:14px}
.av{border-radius:50%;background:linear-gradient(135deg,#c9a27c,#7a5a44);flex:none}
.h{font-family:'Baloo 2',system-ui;font-weight:700;line-height:1.1}
.lbl{font-size:13px;font-weight:700;color:rgba(240,248,255,.52)}
.sub{font-size:13px;color:rgba(240,248,255,.74);font-weight:600}
.cup{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#081a26;box-shadow:inset 0 3px 5px rgba(0,0,0,.5),0 1px 0 rgba(240,248,255,.14)}
.tok{position:relative;border-radius:50%;background:var(--f);box-shadow:0 2px 0 var(--d);display:block}
.tok svg{width:100%;height:100%}
.ink{fill:currentColor}.soft{fill:currentColor;opacity:.42}.rim{fill:none;stroke:var(--f);stroke-width:1.4;stroke-linecap:round}.shine{fill:var(--f);opacity:.55}.burst{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}.cell{fill:none;stroke:currentColor;stroke-width:1.3;opacity:.5}
.well{background:#0e2736;border:1px solid rgba(240,248,255,.1);border-radius:20px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid rgba(240,248,255,.08)}
.row:first-child{border-top:0}
.pill{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#c8452f;color:#f0f8ff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.chev{margin-left:auto;color:rgba(240,248,255,.52);font-weight:800}
.prev{font-size:12.5px;color:rgba(240,248,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:14px;font-weight:800}
.time{font-size:11.5px;color:rgba(240,248,255,.52);margin-left:auto}
.qbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:rgba(240,248,255,.05);border:1px solid rgba(240,248,255,.18);font-size:13px;font-weight:700;color:rgba(240,248,255,.78)}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:780px;height:560px;display:grid;grid-template-columns:300px 1fr;overflow:hidden}
.left{padding:30px 26px;display:flex;flex-direction:column;align-items:center;gap:14px;border-right:1px solid rgba(240,248,255,.1);background:#0e2736}
.stats{display:flex;gap:10px;width:100%}
.stat{flex:1;padding:10px;border-radius:14px;background:rgba(240,248,255,.05);border:1px solid rgba(240,248,255,.1);text-align:center}
.stat b{display:block;font-family:'Baloo 2';font-size:24px;line-height:1}
.shelf{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.right{padding:30px 26px 20px;display:flex;flex-direction:column;gap:12px;min-height:0}
.foot{margin-top:auto;display:flex;gap:16px;font-size:13px;font-weight:700;color:rgba(240,248,255,.62)}</style></head><body><div class="scrim"></div><div class="card"><span class="x">✕</span>
<div class="left"><span class="av" style="width:96px;height:96px"></span><span class="h" style="font-size:28px">Camille</span>
<div class="stats"><span class="stat"><b>#12</b><span class="lbl">rank</span></span><span class="stat"><b>1,240</b><span class="lbl">points</span></span></div>
<span class="lbl" style="align-self:flex-start;margin-top:6px">Boosters · 3 of 3 slots</span><div class="shelf"><span class="cup" style="width:54px;height:54px"><span class="tok" style="width:36px;height:36px;--f:#ffb703;--d:#c78a00;color:#0c2230"><svg viewBox="0 0 32 32"><circle class="soft" cx="12.6" cy="12.4" r="6.6"/><circle class="ink" cx="18.4" cy="18.6" r="7.6"/><circle class="rim" cx="18.4" cy="18.6" r="5"/><path class="rim" d="M18.4 15.6v6"/></svg></span></span><span class="cup" style="width:54px;height:54px"><span class="tok" style="width:36px;height:36px;--f:#c8452f;--d:#9c3220;color:#f0f8ff"><svg viewBox="0 0 32 32"><circle class="ink" cx="14" cy="18.4" r="7"/><circle class="shine" cx="11.4" cy="15.8" r="1.7"/><path class="burst" d="M21 11.2l3.4-3.4M22.6 14.6l4-.6M18.4 9.4l.6-4"/></svg></span></span><span class="cup" style="width:54px;height:54px"><span class="tok" style="width:36px;height:36px;--f:#00c885;--d:#008f5f;color:#0c2230"><svg viewBox="0 0 32 32"><rect class="cell" x="4.2" y="13" width="5.2" height="6" rx="1.6"/><rect class="cell" x="10.6" y="13" width="5.2" height="6" rx="1.6"/><rect class="cell" x="17" y="13" width="5.2" height="6" rx="1.6"/><rect class="cell" x="23.4" y="13" width="5.2" height="6" rx="1.6"/><circle class="ink" cx="19.6" cy="16" r="3.2"/><circle class="ink" cx="26" cy="16" r="3.2"/></svg></span></span></div><span class="qbtn">Manage boosters ›</span>
<div class="foot"><span>Edit profile</span><span style="color:#f08a76">Sign out</span></div></div>
<div class="right"><span class="h" style="font-size:20px">Messages <span class="pill">2</span></span><div class="well" style="flex:1"><div class="row"><span class="av" style="width:40px;height:40px;background:linear-gradient(135deg,#8fb3d9,#3c5f86)"></span><span style="min-width:0;flex:1"><span style="display:flex;gap:8px"><span class="nm">Nora</span><span class="time">2 min</span></span><span class="prev" style="display:block">gg, rematch tonight?</span></span><span class=pill>2</span></div><div class="row"><span class="av" style="width:40px;height:40px;background:linear-gradient(135deg,#d9a98f,#86513c)"></span><span style="min-width:0;flex:1"><span style="display:flex;gap:8px"><span class="nm">Théo</span><span class="time">1 h</span></span><span class="prev" style="display:block">You: see you at 9</span></span></div><div class="row"><span class="av" style="width:40px;height:40px;background:linear-gradient(135deg,#b3d98f,#4f863c)"></span><span style="min-width:0;flex:1"><span style="display:flex;gap:8px"><span class="nm">Ines</span><span class="time">Yesterday</span></span><span class="prev" style="display:block">That 7 split was unreal</span></span></div></div></div>
</div></body></html>
