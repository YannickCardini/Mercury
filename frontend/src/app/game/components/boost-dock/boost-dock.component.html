@if (boosts().length > 0) {
<div class="boost-dock" [class.is-popping]="popping()">
  <button type="button" class="boost-dock__trigger" [class.is-open]="open()" [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="open()" (click)="toggle()">
    @for (b of boosts(); track b.id; let i = $index) {
    <span class="boost-dock__slot" [style.--i]="i" [attr.data-effect]="b.effect">
      <app-boost-token class="boost-dock__token" [effect]="b.effect" [live]="true" />
      @if (b.effect === 'capture_coins' && bountyCoins() > 0) {
      <!-- Recréés à chaque nouvelle valeur : l'animation d'entrée rejoue à
           l'arrivée de chaque pièce, sans minuterie. -->
      @for (n of [bountyCoins()]; track n) {
      <span class="boost-dock__flash"></span>
      <span class="boost-dock__count">{{ n }}</span>
      }
      }
    </span>
    }
  </button>

  @if (open()) {
  <div class="boost-callout" role="status">
    <span class="boost-callout__arrow" aria-hidden="true"></span>
    <p class="boost-callout__title">Boosters active this game</p>
    <ul class="boost-callout__list">
      @for (b of boosts(); track b.id) {
      <li class="boost-callout__item" [attr.data-effect]="b.effect">
        <app-boost-token class="boost-callout__token" [effect]="b.effect" />
        <span class="boost-callout__text">
          <span class="boost-callout__name">{{ b.label }}</span>
          <span class="boost-callout__desc">{{ b.description }}</span>
          @if (b.effect === 'capture_coins') {
          <span class="boost-callout__progress">
            {{ bountyCoins() }} {{ bountyCoins() === 1 ? 'coin' : 'coins' }} earned so far
          </span>
          }
        </span>
      </li>
      }
    </ul>
  </div>
  }
</div>
}
