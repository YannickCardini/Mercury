@if (showPalette()) {
<div class="emoji-backdrop" (click)="closePalette()"></div>
}

<div class="emoji-reactions">
  <button
    type="button"
    class="emoji-trigger"
    [class.is-open]="showPalette()"
    [class.is-cooldown]="cooldownActive()"
    [disabled]="cooldownActive()"
    (click)="togglePalette()"
    aria-label="Send a reaction">
    <span class="emoji-trigger__icon">😀</span>
  </button>

  @if (showPalette()) {
  <div class="emoji-palette" role="menu">
    @for (e of entries(); track e.emoji) {
    <button
      type="button"
      class="emoji-option"
      [class.is-locked]="e.locked"
      role="menuitem"
      [attr.aria-label]="(e.locked ? 'Locked reaction ' : 'Send ') + e.emoji"
      (click)="pickEmoji(e)">
      <span class="emoji-option__glyph">{{ e.emoji }}</span>
      @if (e.locked) {
      <span class="emoji-lock" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
      </span>
      }
    </button>
    }
  </div>
  }
</div>

<div class="emoji-floats" aria-hidden="true">
  @for (f of floating(); track f.id) {
  <span
    class="emoji-float"
    [style.left.px]="f.x"
    [style.top.px]="f.y">
    {{ f.emoji }}
  </span>
  }
</div>
