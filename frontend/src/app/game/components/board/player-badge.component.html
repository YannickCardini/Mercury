<div class="pb" [ngClass]="'pb--' + color()" [class.pb--diamond]="shape() === 'diamond'"
  [class.pb--current]="isCurrentTurn()" [class.pb--partner]="isPartner()" [class.pb--disconnected]="!isConnected()"
  [class.pb--empty]="!player()">

  <!-- Jeton : liseré-timer à la couleur du siège, tranche dessous. -->
  <app-player-badge-ring [isCurrentTurn]="isCurrentTurn()" [timer]="timer()" [shape]="shape()">
  </app-player-badge-ring>

  <!-- Photo de profil (ou silhouette par défaut), incrustée dans le liseré. -->
  <div class="pb-avatar">
    @if (player()?.picture) {
    <img [src]="player()!.picture" alt="" referrerpolicy="no-referrer" />
    } @else {
    <svg class="pb-placeholder" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.69-8 6v2h16v-2c0-3.31-3.58-6-8-6Z" />
    </svg>
    }
  </div>

  <!-- Main du joueur (haut-droite) : deux cartes en éventail, le nombre de
       cartes restantes écrit sur celle du dessus. -->
  @if (player(); as p) {
  <div class="pb-hand" [attr.title]="p.cardsLeft + ' cards'">
    <span class="pb-hand-card pb-hand-card--back" aria-hidden="true"></span>
    <span class="pb-hand-card pb-hand-card--front">{{ p.cardsLeft }}</span>
  </div>
  }

  <!-- Socle (bas) : le jeton s'y emboîte. Nom, puis rang (médaille selon le
       palier). L'étiquette du coéquipier se pose à cheval sur son bord haut. -->
  @if (player()) {
  <div class="pb-plinth">
    @if (isPartner()) {
    <span class="pb-partner">Teammate</span>
    }
    <span class="pb-name">{{ displayName() }}</span>
    @if (rank() !== null) {
    <span class="pb-rank" [ngClass]="'pb-rank--' + rankTier()">Rank #{{ rank() }}</span>
    }
  </div>
  }

  <!-- Indicateur de déconnexion (haut-gauche) -->
  @if (player() && !isConnected()) {
  <div class="pb-offline" title="Disconnected">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <path d="M1 1l22 22" />
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <line x1="12" y1="20" x2="12.01" y2="20" />
    </svg>
  </div>
  }
</div>
