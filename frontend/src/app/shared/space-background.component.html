<div class="space-bg" [class.calm]="calm()" [class.day]="isDay()" aria-hidden="true">
  <!-- ════════ Mars en cours de terraformation ════════
       Un matin clair en mode jour, la même vue de nuit en mode nuit, en aplats
       étagés. Tout s'ancre sur la ligne d'horizon (--m-horizon). Les blocs
       « mars: » sont générés par resources/mars/generate-mars-landscape.py
       --write-template, leurs couleurs dans _mars-palette.scss : modifier le
       script, pas ces blocs. Le ciel vient d'abord : le paysage, dessiné
       ensuite, cache ce qui passe sous l'horizon.
       Les calques existent dans les deux modes (étoiles invisibles le jour,
       un seul conteneur pour les soleils ou les lunes) : à la bascule, chacun
       passe du jour à la nuit à son tour (voir « Le soir tombe », styles.scss).
       Dans /game (mode calme), rien n'est rendu : le plateau cache le paysage,
       seul reste le ciel en bandes de l'hôte (--m-sky), sans aucune animation. -->
  @if (!calm()) {

  <!-- Ciel en bandes nettes (le dégradé --m-sky de l'hôte, dessous, est le même) -->
  <!-- mars:sky -->
  <div class="mars-band mars-band-1" style="top: 0; height: calc(var(--m-horizon) * 0.16)"></div>
  <div class="mars-band mars-band-2" style="top: calc(var(--m-horizon) * 0.16); height: calc(var(--m-horizon) * 0.16)"></div>
  <div class="mars-band mars-band-3" style="top: calc(var(--m-horizon) * 0.32); height: calc(var(--m-horizon) * 0.14)"></div>
  <div class="mars-band mars-band-4" style="top: calc(var(--m-horizon) * 0.46); height: calc(var(--m-horizon) * 0.12)"></div>
  <div class="mars-band mars-band-5" style="top: calc(var(--m-horizon) * 0.58); height: calc(var(--m-horizon) * 0.11)"></div>
  <div class="mars-band mars-band-6" style="top: calc(var(--m-horizon) * 0.69); height: calc(var(--m-horizon) * 0.1)"></div>
  <div class="mars-band mars-band-7" style="top: calc(var(--m-horizon) * 0.79); height: calc(var(--m-horizon) * 0.085)"></div>
  <div class="mars-band mars-band-8" style="top: calc(var(--m-horizon) * 0.875); height: calc(var(--m-horizon) * 0.07)"></div>
  <div class="mars-band mars-band-9" style="top: calc(var(--m-horizon) * 0.945); height: calc(var(--m-horizon) * 0.055)"></div>
  <!-- /mars:sky -->

  <!-- Ciel étoilé fixe, trois tailles d'étoiles, et une poignée d'étoiles qui
       scintillent légèrement. Le conteneur existe dans les deux modes (pour la
       bascule), les étoiles seulement la nuit. -->
  <div class="mars-stars">
    @if (!isDay()) {
    @let sky = starField();
    <div class="stars stars--small" [style.box-shadow]="sky.small"></div>
    <div class="stars stars--medium" [style.box-shadow]="sky.medium"></div>
    <div class="stars stars--large" [style.box-shadow]="sky.large"></div>
    @for (t of sky.twinkles; track $index) {
    <span
      class="twinkle"
      [style.top.%]="t.top"
      [style.left.%]="t.left"
      [style.width.px]="t.size"
      [style.height.px]="t.size"
      [style.animation-delay.s]="t.delay"
      [style.animation-duration.s]="t.duration"></span>
    }
    }
  </div>

  <!-- Les astres : deux soleils le jour, deux lunes la nuit, au même endroit. -->
  <div class="mars-astres">
    @if (isDay()) {
    <!-- mars:day-sky -->
    <!-- Double lever de soleil : le grand, perle, presque levé ; le petit,
         or pâle, qui perce à peine. Une brume les traverse. -->
    <svg class="mars-suns" viewBox="0 0 400 240">
      <circle cx="230" cy="134" r="118" fill="#fff6e8" fill-opacity=".07" />
      <circle cx="230" cy="134" r="88" fill="#fff6e8" fill-opacity=".13" />
      <circle cx="230" cy="134" r="64" fill="#fff6e8" fill-opacity=".22" />
      <circle cx="230" cy="134" r="47" fill="#fff6e8" fill-opacity=".38" />
      <circle cx="172" cy="141" r="38" fill="#ffe7c4" fill-opacity=".14" />
      <circle cx="172" cy="141" r="27" fill="#ffe7c4" fill-opacity=".3" />
      <circle cx="230" cy="134" r="34" fill="#fffaf1" />
      <circle cx="172" cy="141" r="16" fill="#ffdca6" />
      <circle cx="172" cy="141" r="9.9" fill="#fff0d6" />
    </svg>
    <div class="mars-mist mars-mist--sun">
      <svg viewBox="0 0 240 40">
        <defs>
          <linearGradient id="mars-mist-sun">
            <stop class="mx-nacre-a" offset="0" stop-opacity="0" />
            <stop class="mx-nacre-a" offset=".2" />
            <stop class="mx-nacre-b" offset=".45" />
            <stop class="mx-nacre-c" offset=".7" />
            <stop class="mx-nacre-c" offset="1" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g fill="url(#mars-mist-sun)">
          <rect x="30" y="12" width="160" height="4" rx="2" />
          <rect x="84" y="22" width="150" height="3" rx="1.5" />
          <rect x="12" y="29" width="116" height="2.6" rx="1.3" />
        </g>
      </svg>
    </div>
    <!-- /mars:day-sky -->
    } @else {
    <!-- mars:night-sky -->
    <!-- Phobos et Deimos, là où les soleils se lèvent le matin. -->
    <svg class="mars-moons" viewBox="0 0 400 240">
      <defs>
        <clipPath id="mars-phobos">

        </clipPath>
      </defs>
      <circle cx="200" cy="120" r="78" fill="#c9d6f0" fill-opacity=".03" />
      <circle cx="200" cy="120" r="54" fill="#c9d6f0" fill-opacity=".05" />
      <circle cx="200" cy="120" r="36" fill="#c9d6f0" fill-opacity=".09" />
      <path d="M225.2 111.8L226.2 113.8L226.6 116L226.5 118.3L225.9 120.5L224.9 122.7L223.8 124.7L222.5 126.7L221.1 128.5L219.7 130.3L218.2 132L216.5 133.7L214.8 135.2L212.8 136.5L210.7 137.6L208.5 138.5L206.2 139.2L203.9 139.7L201.6 140.1L199.3 140.4L197 140.8L194.6 141.1L192 141.3L189.5 141.3L186.9 141L184.5 140.3L182.4 139.1L180.6 137.6L179.3 135.7L178.5 133.6L178 131.4L177.8 129.3L177.7 127.3L177.6 125.3L177.4 123.4L177.2 121.5L177 119.5L176.9 117.5L177 115.4L177.5 113.3L178.3 111.2L179.5 109.2L180.9 107.4L182.7 105.7L184.6 104.2L186.6 102.8L188.7 101.5L190.9 100.3L193.3 99.2L195.7 98.4L198.2 97.9L200.7 97.7L203.2 98L205.5 98.6L207.7 99.5L209.6 100.6L211.3 101.8L213 103L214.7 104.1L216.4 105.1L218.3 106.1L220.2 107.2L222.1 108.5L223.8 110Z" fill="#cdc6bb" />
      <g clip-path="url(#mars-phobos)">
        <ellipse cx="183" cy="122" rx="21" ry="28" fill="#8e887f" fill-opacity=".6" />
        <ellipse cx="192" cy="125" rx="6.5" ry="5.6" fill="#a59e94" />
        <path d="M196.8 121.2A6.5 5.6 0 0 1 197.4 128.4" fill="none" stroke="#dcd6cc" stroke-width="1.1" />
        <circle cx="209" cy="113" r="2.6" fill="#b8b0a5" />
        <circle cx="213" cy="126" r="1.8" fill="#b8b0a5" />
      </g>
      <g class="mars-deimos">
        <circle cx="250" cy="50" r="16" fill="#dfe6f5" fill-opacity=".06" />
        <circle cx="250" cy="50" r="10" fill="#dfe6f5" fill-opacity=".12" />
        <circle cx="250" cy="50" r="4.5" fill="#f1eee8" />
      </g>
    </svg>
    <!-- /mars:night-sky -->
    }
  </div>

  @if (!isDay()) {
  <!-- Étoiles filantes occasionnelles, qui tombent derrière les mesas -->
  <div class="shooting-star shooting-star--1"></div>
  <div class="shooting-star shooting-star--2"></div>
  <div class="shooting-star shooting-star--3"></div>

  <!-- Vaisseau : apparition aléatoire et rare (piloté en TS), de nuit -->
  @if (ship(); as s) {
  <div
    class="spaceship"
    [class.spaceship--rtl]="!s.ltr"
    [style.top.%]="s.top"
    [style.animation-duration.ms]="s.duration">
    <svg viewBox="0 0 64 24" width="100%" height="100%" fill="none">
      <defs>
        <radialGradient id="ship-glow">
          <stop offset="0" stop-color="#8fa6cf" stop-opacity=".45" />
          <stop offset="1" stop-color="#8fa6cf" stop-opacity="0" />
        </radialGradient>
      </defs>
      <!-- Halo (remplace un drop-shadow, voir le SCSS) -->
      <ellipse cx="38" cy="12" rx="30" ry="12" fill="url(#ship-glow)" />
      <!-- Traînée de réacteur -->
      <path class="spaceship__trail" d="M2 12 H22" stroke-linecap="round" />
      <!-- Coque -->
      <path
        d="M20 12 C28 6, 44 6, 56 12 C44 18, 28 18, 20 12 Z"
        fill="#8fa6cf" />
      <!-- Cockpit -->
      <ellipse cx="42" cy="11" rx="6" ry="3" fill="#bfe3ff" opacity="0.9" />
      <!-- Aileron -->
      <path d="M24 12 L18 4 L28 10 Z" fill="#5d749e" />
    </svg>
  </div>
  }
  }

  </svg>
  <div class="mars-mist mars-mist--far">
    <svg viewBox="0 0 3200 55" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="mars-mist-nacre">
          <stop class="mx-nacre-a" offset="0" stop-opacity="0" />
