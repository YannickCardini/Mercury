<span class="bt-face">
  @if (effect() === 'capture_coins') {
    <span class="bt-mult"><span class="bt-x">+</span>{{ perCapture }}</span>
  } @else {
    <span class="bt-mult"><span class="bt-x">×</span>{{ multiplier }}</span>
  }
</span>
<span class="bt-emblem">
  @if (effect() !== 'double_points') {
    <span class="bt-coin"></span>
  } @else {
    <svg class="bt-star" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 1.5c.6 5.6 4.9 9.9 10.5 10.5-5.6.6-9.9 4.9-10.5 10.5C11.4 16.9 7.1 12.6 1.5 12 7.1 11.4 11.4 7.1 12 1.5Z" />
    </svg>
  }
</span>
