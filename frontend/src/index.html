<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Mercury | Play Tock, Keezen and DOG Online</title>
  <meta name="description"
    content="Play Mercury, an adaptation of the classic games Tock, Keezenspel, DOG, and Pegs and Jokers. Play for free!" />
  <link rel="canonical" href="https://www.mercury-game.online/" />
  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <!-- Mode jour / nuit posé avant le premier rendu (même règle que
       ThemeService) : sans lui, un joueur en mode jour verrait la nuit le temps
       que l'app démarre. -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("mercury-theme"); } catch (e) { }
      if (theme !== "day" && theme !== "night") {
        var light = window.matchMedia && !window.matchMedia("(prefers-color-scheme: dark)").matches;
        theme = light ? "day" : "night";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.svg" />

  <!-- Polices du premier écran (voir src/app/styles/tokens.css). Les URL doivent
       rester celles des @font-face, sinon le préchargement ne sert à rien. -->
  <link rel="preload" href="/assets/fonts/baloo-2-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2"
    crossorigin />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

</head>

<body>
  <app-root></app-root>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=61547b95-f298-4886-bb80-3f34e6ec3fe6"></script>
<!-- impeccable-live-end -->
</body>

</html>
